# =====================================================================
# SORI 예제 — 전농사거리 기본값 계산 (서울 동대문구, 사가정로·전농로·답십리로·서울시립대로)
# 03_전농사거리_SORI계산/config.yaml 과 같은 설정. 계산 결과는 output/ 에 들어 있음(앱 처음 실행 시 기본 예제).
# 다시 계산하려면 수치지도(data/map)와 DEM(data/dem, 국토지리정보원 공개 DEM 도엽 37705)을 받아 넣어야 함 — README.md.
# ※ 본 설정은 Claude(Anthropic의 AI)를 활용하여 작성하였음. 계산 결과의 검토·검증 책임은 사용자에게 있음.
# =====================================================================
project: {name: 전농사거리, output_dir: output, scenario: 현황, file_naming: false}   # 규칙 이름 사본(…-ISO_주간_grid…) 만들지 않음(2026-11-19 정리)
crs: 5186
input:
  map:
    folders: [data/map]
  traffic: {path: traffic.csv, default_road_type: gemeinde}
  road_alias: {전농로25길: 전농로}
  surface_map: {아스팔트: AC11, 아스팔트콘크리트: AC11}
  junctions: {dk_rule: nearest_signal, path: null}
  dem: {path: data/dem/전농사거리_(B080)공개DEM_37705_img_2025.zip}
  ground: {soft_polygons: null, method: general, default_G: 0.0}
  road_override: {path: roads_override.csv}
receivers:
  center: [205108.0, 553110.0]
  grid:
    enabled: true
    size: [480.0, 520.0]
    step: 2.5
    heights: [4.0]
    bbox: null
  facade: {enabled: true, radius: 200.0, area: grid, piece: 10.0}
  points: {path: points.csv, default_height: null, measured: null}
plots:
  limits: {LrT: 68, LrN: 58, label: 도로교통소음 관리기준(주거지역 등) 주간 68 / 야간 58 dB(A)}
model: {floor_height: 3.0, road_surface: flatten, minor_roads: exclude}
propagation_method: iso9613_2
propagation:
  temperature_C: 15.0
  humidity_pct: 70.0
  reflection: {rho: 0.8, max_order_grid: 3, max_order_facade: 3, max_order_point: 3}
  cmet_C0: 0.0
  lateral: {enabled: true}
